# This workflow is managed by gh actions-lock.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: presets/web-voidzero-go/web
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          package_json_file: presets/web-voidzero-go/web/package.json
      - uses: actions/setup-node@v7.1.0 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          node-version-file: presets/web-voidzero-go/web/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint:css
      - run: pnpm test
      - run: pnpm run build

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: presets/web-voidzero-go/api
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          go-version: '1.26.3'
          cache: false
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: golangci-lint run
      - run: go test -race ./...
      - run: go build ./...

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          go-version: '1.26.3'
          cache: false
      - name: Check workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml parts/github-actions/ci.yml presets/homebrew-cli/.github/workflows/*.yml presets/chrome-extension/.github/workflows/*.yml
      - name: Keep copyable workflow action refs in sync
        run: python3 scripts/check_action_versions.py .github/workflows/ci.yml parts/github-actions/ci.yml presets/homebrew-cli/.github/workflows/prepare-homebrew.yml presets/chrome-extension/.github/workflows/ci.yml
      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.1.6
          gh actions-lock --verify
      - uses: zizmorcore/zizmor-action@v0.6.4 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          version: 1.30.0
          advanced-security: false

  homebrew-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          persist-credentials: false
      - name: Check formula generation and Ruby syntax
        run: python3 -m unittest discover -s presets/homebrew-cli/tests -v

  chrome-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: presets/chrome-extension
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0 # zizmor: ignore[unpinned-uses] -- Verified by gh actions-lock; commit pinned in actions.lock.
        with:
          node-version-file: presets/chrome-extension/.node-version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package
